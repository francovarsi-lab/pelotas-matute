<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pelotas Matute</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>
</head>
<body>
<main id="app">
  <section id="viewer">
    <h1>Pelotas Matute</h1>
    <canvas id="gl"></canvas>
  </section>

  <aside id="sheet" class="open">
    <button id="handle" aria-expanded="true"><span class="grip"></span>Personalizar</button>
    <div id="controls">
      <h2>Desplegable</h2>
      <div class="row">
        <select id="viewKind" aria-label="Vista">
          <option value="cont">Continuo</option><option value="gajos">Gajos</option><option value="rect">Rectangular</option>
        </select>
        <select id="viewN" aria-label="Cantidad de gajos de la vista" hidden>
          <option>6</option><option selected>8</option><option>12</option>
        </select>
        <label class="inline"><input id="grid" type="checkbox"> Cuadrícula</label>
      </div>
      <div id="flatbox"></div>
      <p class="hint">Arrastrá la imagen acá. Cuadrado = tamaño, círculo = rotación.</p>

      <h2>Plantilla</h2>
      <div id="templates" class="row"></div>
      <label id="gajosRow" hidden>Cantidad de gajos <output id="gajosOut"></output>
        <input id="gajos" type="range" min="2" max="24" value="8"></label>

      <h2>Paneles</h2>
      <p class="hint">Tocá un panel en la pelota o elegilo acá.</p>
      <div id="chips" class="row"></div>
      <div class="row">
        <div id="palette" class="row"></div>
        <input id="panelColor" type="color" aria-label="Color libre">
      </div>

      <h2>Costuras</h2>
      <label class="inline">Color <input id="seamColor" type="color" value="#1a1a1a"></label>
      <label>Grosor <output id="thickOut"></output><input id="thick" type="range" min="0" max="4" step="0.1" value="1.2"></label>

      <h2>Imagen</h2>
      <div class="row">
        <label class="btn">Subir imagen<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
        <button id="remove" class="btn" disabled>Quitar imagen</button>
      </div>
      <div class="stepper">Cantidad de imágenes
        <button id="less" aria-label="Menos">−</button><output id="count">1</output><button id="more" aria-label="Más">+</button>
      </div>
      <label>Tamaño <output></output><input id="size" type="range" min="10" max="120" value="50" data-unit="°"></label>
      <label>Rotación <output></output><input id="rot" type="range" min="-180" max="180" value="0" data-unit="°"></label>
      <label>Longitud <output></output><input id="lon" type="range" min="-180" max="180" value="0" data-unit="°"></label>
      <label>Latitud <output></output><input id="lat" type="range" min="-90" max="90" value="0" data-unit="°"></label>
      <p class="hint">También podés arrastrar la imagen sobre la pelota. Tu imagen no sale de tu dispositivo.</p>
    </div>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
